name: CI

on:
  # Runs when code lands on main, including when a pull request is merged.
  push:
    branches: [main]
  # Runs on every pull request into main, before it is merged.
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show what triggered this run
        run: |
          echo "Event:  ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "By:     ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # -v lists every test by name with PASSED or FAILED.
      # shell: bash turns on pipefail, so a failing test still fails the step.
      - name: Test
        shell: bash
        run: uv run pytest -v 2>&1 | tee pytest-output.txt

      # Writes the results to the run's summary page, even if tests failed.
      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo ""
            echo "Triggered by **${{ github.event_name }}** on \`${{ github.ref_name }}\` by @${{ github.actor }}"
            echo ""
            echo '```'
            cat pytest-output.txt 2>/dev/null || echo "Tests did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
